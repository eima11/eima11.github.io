<!-- PREVIEW: webinar / strategy-call outline as a player -->
<section class="sec" id="preview" aria-labelledby="pvH">
  <div class="wrap">
    <div class="head">
      <div><p class="eyebrow" data-show="launch">Free webinar preview</p><p class="eyebrow" data-show="scale">Strategy call preview</p>
        <h2 id="pvH" data-show="launch">60 minutes. Here's what you'll get.</h2>
        <h2 data-show="scale">25 minutes on your numbers.</h2></div>
    </div>
    <div class="pv">
      <div class="pl" id="pl">
        <img class="pl-img" id="plImg" src="assets/hero.jpg" alt="">
        <span class="pl-tag"><i></i><span data-show="launch">Webinar outline</span><span data-show="scale">Call outline</span> · preview</span>
        <div class="pl-cap"><span class="pl-k" id="plK">Chapter 1</span><b id="plT">Why short-term rentals, why now</b></div>
        <div class="pl-bar">
          <button type="button" class="pl-play" id="plPlay" aria-label="Pause preview"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path id="plIcon" d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z" fill="currentColor"/></svg></button>
          <span class="pl-time" id="plTime">00:00 / 60:00</span>
          <div class="pl-track" id="plTrack"><i id="plFill"></i></div>
          <span class="pl-mute" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M17 9l4 6M21 9l-4 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span>
        </div>
      </div>
      <div class="chaps">
        <ol id="chapList"></ol>
        <button class="btn btn-acc btn-block" type="button" data-primary><span data-show="launch">Save my free seat</span><span data-show="scale">Book my strategy call</span><svg class="i"><use href="#i-arrow"/></svg></button>
      </div>
    </div>
  </div>
</section>
