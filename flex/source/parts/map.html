<div class="head">
      <div><p class="eyebrow">Learn from a live operator</p><h2 id="citiesH">We run apartments in 7 cities.</h2></div>
      <p>Tap a city to see what it taught us, and what you'll learn from it.</p>
    </div>
    <div class="mapgrid">
      <div class="map">
        <svg viewBox="0 0 699 600" role="img" aria-label="Map of The Flex cities in Europe and North Africa"><path class="land" d="{{MAPPATH}}"/><g id="pins"></g></svg>
      </div>
      <div class="cpanel" aria-live="polite">
        <div class="cp-img"><img id="cpImg" src="assets/london.jpg" alt=""><span class="cp-st" id="cpSt">Live</span></div>
        <div class="cp-body">
          <p class="eyebrow" id="cpCountry">United Kingdom</p>
          <h3 id="cpName">London</h3>
          <p class="cp-k">What it taught us</p>
          <b class="cp-lesson" id="cpLesson"></b>
          <p class="cp-line" id="cpLine"></p>
          <span class="chip-s" id="cpMod"></span>
        </div>
        <div class="cp-list" id="cpList" role="tablist" aria-label="Cities"></div>
      </div>
    </div>
